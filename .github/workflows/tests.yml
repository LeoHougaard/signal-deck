name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Unit and isolated lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q signal_deck tests
